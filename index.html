<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Untuk Kamu 💙</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;height:100vh;background:linear-gradient(#02051c,#07144a 55%,#08295e);font-family:Georgia,serif;color:white}.scene{height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 78% 15%,#b9dcff35,transparent 14%)}.moon{position:absolute;right:9%;top:8%;width:85px;height:85px;border-radius:50%;background:#eaf6ff;box-shadow:0 0 35px #9edcffaa}.star{position:absolute;width:2px;height:2px;background:#dff2ff;border-radius:50%;animation:tw 2s infinite alternate}@keyframes tw{to{opacity:1;transform:scale(1.6)}}.photo{position:absolute;z-index:5;left:50%;top:5%;transform:translateX(-50%);width:165px;padding:9px 9px 25px;background:#edf7ff;box-shadow:0 8px 30px #0008}.photo img{display:block;width:100%;height:145px;object-fit:cover;background:#9cc9ef}.photo p{position:absolute;bottom:3px;left:0;right:0;text-align:center;margin:0;color:#164a87;font-size:12px;font-family:cursive}.field{position:absolute;bottom:0;width:100%;height:38%;background:linear-gradient(#092d63,#061b46 60%,#031333)}.grass{position:absolute;bottom:0;width:100%;height:70px;background:repeating-linear-gradient(100deg,transparent 0 12px,#4696cd59 13px 15px,transparent 16px 28px)}.lily{position:absolute;bottom:38px;width:120px;height:170px;animation:sway 4s ease-in-out infinite alternate}@keyframes sway{to{transform:rotate(2deg)}}.stem{position:absolute;left:58px;bottom:0;width:5px;height:0;border-radius:5px;background:linear-gradient(#48a7b7,#16556e);animation:stem 1.5s forwards}.leaf{position:absolute;width:48px;height:18px;background:#17647a;border-radius:100% 0;opacity:0;animation:leaf .7s forwards 1.2s}.one{left:16px;bottom:63px;transform:rotate(22deg)}.two{left:59px;bottom:83px;transform:scaleX(-1) rotate(22deg)}@keyframes stem{to{height:120px}}@keyframes leaf{to{opacity:1}}.bloom{position:absolute;left:22px;bottom:106px;width:75px;height:75px}.petal{position:absolute;left:25px;top:18px;width:27px;height:48px;background:linear-gradient(145deg,#fff,#cce9ff);border-radius:70% 70% 35% 35%;transform:scale(0) rotate(var(--r));transform-origin:50% 88%;box-shadow:0 0 12px #b4e1ff77;animation:open .7s forwards}.p1{--r:0deg;animation-delay:1.7s}.p2{--r:60deg;animation-delay:1.82s}.p3{--r:120deg;animation-delay:1.94s}.p4{--r:180deg;animation-delay:2.06s}.p5{--r:240deg;animation-delay:2.18s}.p6{--r:300deg;animation-delay:2.3s}@keyframes open{to{transform:scale(1) rotate(var(--r))}}.center{position:absolute;left:31px;top:38px;width:15px;height:15px;border-radius:50%;background:#8bd4ff;box-shadow:0 0 13px #75cfff;opacity:0;animation:show .4s forwards 2.8s}@keyframes show{to{opacity:1}}.message{position:absolute;z-index:10;left:50%;bottom:6%;transform:translateX(-50%);width:90%;text-align:center;opacity:0;animation:msg 1.5s forwards 4.2s;text-shadow:0 2px 10px #000}.message h1{font-size:clamp(25px,5vw,42px);margin:0 0 8px;color:#bfe8ff}.message p{font-size:clamp(14px,2.5vw,19px);line-height:1.6;margin:0}@keyframes msg{to{opacity:1;transform:translateX(-50%)}}.tap{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);font-size:11px;color:#9edcff88}
</style></head><body><div class="scene"><div id="stars"></div><div class="moon"></div><div class="field"><div class="grass"></div></div><div id="flowers"></div><div class="message"><h1>for you</h1><p>p p apa? pauror<br></p></div><div class="tap"></div></div><script>
for(let i=0;i<75;i++){let s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*65+"%";s.style.animationDelay=Math.random()*3+"s";document.getElementById("stars").appendChild(s)}
let ps=[[5,2],[13,8],[21,0],[29,12],[37,4],[45,15],[53,2],[61,10],[69,1],[77,13],[85,4],[93,11],[10,25],[25,29],[40,24],[56,30],[72,25],[88,28]];
ps.forEach((p,i)=>{let f=document.createElement("div");f.className="lily";f.style.left=p[0]+"%";f.style.bottom=25+p[1]+"px";f.style.transform=`scale(${.55+Math.random()*.45})`;f.innerHTML='<div class="stem"></div><div class="leaf one"></div><div class="leaf two"></div><div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="center"></div></div>';document.getElementById("flowers").appendChild(f)});document.body.onclick=()=>location.reload();
</script></body></html>
